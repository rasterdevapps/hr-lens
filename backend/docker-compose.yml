# Local PostgreSQL for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hrlens
      POSTGRES_PASSWORD: hrlens
      POSTGRES_DB: hrlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
